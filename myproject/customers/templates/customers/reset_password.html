{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reset Password - Hume Properties</title>
    <link rel="stylesheet" href="{% static 'website/style.css' %}">
</head>

<body>

{% include 'website/header.html' %}

<div class="login-page-scope">
    <div class="login-wrapper" style="justify-content: center;">

        <div class="login-card" style="max-width: 500px; width: 100%;">
            <div class="login-form-side" style="width: 100%;">

                <h2>Reset Password</h2>

                <p class="subtitle">
                    Enter your new password below.
                </p>

                {% if messages %}
                    {% for message in messages %}
                        <div style="
                            padding: 12px;
                            margin-bottom: 15px;
                            border-radius: 8px;
                            background: #fee2e2;
                            color: #991b1b;
                        ">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}

                <form method="POST" action="{% url 'reset_password' %}">
                    {% csrf_token %}

                    <div class="form-group">
                        <label>New Password</label>

                        <input
                            type="password"
                            name="new_password"
                            placeholder="Enter new password"
                            minlength="8"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label>Confirm Password</label>

                        <input
                            type="password"
                            name="confirm_password"
                            placeholder="Confirm new password"
                            minlength="8"
                            required
                        >
                    </div>

                    <button
                        type="submit"
                        class="submit-btn"
                        style="width: 100%; margin-top: 15px;"
                    >
                        Update Password
                    </button>

                </form>

            </div>
        </div>

    </div>
</div>

{% include 'website/footer.html' %}

</body>
</html>
