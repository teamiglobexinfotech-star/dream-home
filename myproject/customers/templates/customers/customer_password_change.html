<div class="card-section" style="max-width: 600px; margin: 0 auto; background: #ffffff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); border: 1px solid #e2e8f0; font-family: inherit;">
    
    <!-- Top Header (No extra back button needed since it's a separate menu) -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid #f1f5f9; padding-bottom: 12px;">
        <h3 style="margin: 0; font-size: 18px; color: #1e293b; font-weight: 650;">Change Password</h3>
    </div>

    <!-- Password Change Form -->
    <form id="ajaxPasswordForm" method="POST" action="{% url 'change_password' %}" style="background: #f8fafc; padding: 15px; border-radius: 8px; border: 1px solid #e2e8f0;">
        {% csrf_token %}
        
        <!-- Inline Message Area -->
        <div id="inlinePasswordAlert" style="display: none; padding: 10px 12px; margin-bottom: 15px; border-radius: 6px; font-size: 13px; font-weight: 500;"></div>

        <div style="margin-bottom: 12px;">
            <label style="display: block; font-size: 12px; font-weight: 600; margin-bottom: 4px; color: #334155;">Current Password</label>
            <input type="password" name="old_password" required style="width: 100%; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; background: #fff; box-sizing: border-box;">
        </div>

        <div style="margin-bottom: 12px;">
            <label style="display: block; font-size: 12px; font-weight: 600; margin-bottom: 4px; color: #334155;">New Password</label>
            <input type="password" name="new_password1" required style="width: 100%; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; background: #fff; box-sizing: border-box;">
        </div>

        <div style="margin-bottom: 15px;">
            <label style="display: block; font-size: 12px; font-weight: 600; margin-bottom: 4px; color: #334155;">Confirm New Password</label>
            <input type="password" name="new_password2" required style="width: 100%; padding: 8px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; background: #fff; box-sizing: border-box;">
        </div>

        <button type="submit" id="pwdSubmitBtn" style="background: #2563eb; color: white; border: none; padding: 8px 18px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 500;">Update Password</button>
    </form>
</div>
