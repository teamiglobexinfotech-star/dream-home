<style>
    #dashboard-toast {
        position: fixed;
        top: 14px;
        right: 14px;
        z-index: 10000;
        display: flex;
        align-items: center;
        gap: 9px;
        width: min(310px, calc(100vw - 28px));
        padding: 10px 12px;
        border: 1px solid #bbf7d0;
        border-radius: 8px;
        background: #f0fdf4;
        color: #166534;
        box-shadow: 0 5px 16px rgba(15, 23, 42, 0.14);
        font: 500 13px/1.4 'Inter', sans-serif;
        opacity: 0;
        transform: translateY(-6px);
        transition: opacity 160ms ease, transform 160ms ease;
    }

    #dashboard-toast.is-visible {
        opacity: 1;
        transform: translateY(0);
    }

    #dashboard-toast[hidden] {
        display: none;
    }

    #dashboard-toast .toast-icon {
        display: grid;
        flex: 0 0 20px;
        width: 20px;
        height: 20px;
        place-items: center;
        border-radius: 50%;
        background: #16a34a;
        color: #fff;
        font-size: 12px;
    }

    #dashboard-toast-message {
        flex: 1;
    }

    #dashboard-toast-close {
        padding: 0 2px;
        border: 0;
        background: transparent;
        color: #4b5563;
        cursor: pointer;
        font-size: 18px;
        line-height: 1;
    }
</style>

<div id="dashboard-toast" role="status" aria-live="polite" hidden>
    <span class="toast-icon" aria-hidden="true">✓</span>
    <span id="dashboard-toast-message"></span>
    <button id="dashboard-toast-close" type="button" aria-label="Dismiss notification">&times;</button>
</div>

<script>
    (function () {
        const toast = document.getElementById('dashboard-toast');
        const message = document.getElementById('dashboard-toast-message');
        const closeButton = document.getElementById('dashboard-toast-close');
        let hideTimer;
        let dismissTimer;

        window.showDashboardToast = function (text) {
            if (!toast || !message) return;

            window.clearTimeout(hideTimer);
            window.clearTimeout(dismissTimer);
            message.textContent = text;
            toast.hidden = false;
            requestAnimationFrame(function () {
                toast.classList.add('is-visible');
            });

            hideTimer = window.setTimeout(function () {
                toast.classList.remove('is-visible');
                dismissTimer = window.setTimeout(function () {
                    toast.hidden = true;
                }, 180);
            }, 2800);
        };

        if (closeButton) {
            closeButton.addEventListener('click', function () {
                window.clearTimeout(hideTimer);
                window.clearTimeout(dismissTimer);
                toast.classList.remove('is-visible');
                dismissTimer = window.setTimeout(function () {
                    toast.hidden = true;
                }, 180);
            });
        }

        {% for message in messages %}
            {% if 'dashboard_toast' in message.tags %}
                window.showDashboardToast('{{ message|escapejs }}');
            {% endif %}
        {% endfor %}
    })();
</script>
