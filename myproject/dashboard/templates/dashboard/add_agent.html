<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add New Agent</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        .agent-form-box {
            max-width: 750px;
            margin: 30px auto;
            background: #ffffff;
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
        }

        .agent-form-box .form-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 12px;
        }

        .agent-form-box h2 {
            font-size: 20px;
            font-weight: 700;
            color: #1e293b;
            margin: 0;
        }

        .agent-form-box .btn-back {
            background-color: #f1f5f9;
            color: #475569;
            padding: 6px 14px;
            font-size: 13px;
            font-weight: 600;
            border-radius: 6px;
            text-decoration: none;
            transition: background 0.2s;
        }

        .agent-form-box .btn-back:hover {
            background-color: #e2e8f0;
            color: #1e293b;
        }

        .agent-form-box .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 18px;
        }

        .agent-form-box form label {
            font-size: 13px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 6px;
        }

        .agent-form-box form input {
            width: 100%;
            padding: 10px 14px;
            font-size: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            background-color: #f8fafc;
            color: #1e293b;
            outline: none;
            box-sizing: border-box;
            transition: all 0.2s ease;
        }

        .agent-form-box form input:focus {
            border-color: #3b82f6;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        .agent-form-box .password-field {
            position: relative;
        }

        .agent-form-box .password-field input {
            padding-right: 42px;
        }

        .agent-form-box .password-toggle {
            position: absolute;
            top: 50%;
            right: 10px;
            transform: translateY(-50%);
            border: 0;
            padding: 4px;
            color: #64748b;
            background: transparent;
            cursor: pointer;
        }

        .agent-form-box .password-toggle[hidden] {
            display: none;
        }

        .agent-form-box form button[type="submit"] {
            background-color: #22c55e;
            color: #ffffff;
            font-weight: 600;
            padding: 10px 22px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }

        .agent-form-box form button[type="submit"]:hover {
            background-color: #16a34a;
        }

        @media (max-width: 768px) {
            .agent-form-box {
                margin: 15px;
                padding: 24px;
            }

            .agent-form-box .form-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }
        }
    </style>
</head>
<body>
    {% if show_dashboard_toast %}
        {% include "dashboard/_toast.html" %}
    {% endif %}
    <div class="agent-form-box">
        <div class="form-header">
            <h2>Add New Agent</h2>
            <a href="{% url 'agent_list' %}" class="btn-back nav-link-ajax">
                ← Back to Agents
            </a>
        </div>
        
        <form method="POST" action="{% url 'add_agent' %}" enctype="multipart/form-data" class="ajax-form">
            {% csrf_token %}
            <div class="form-group">
                <label>Agent Name</label>
                <input type="text" name="name" value="{{ agent_form_values.name|default:'' }}" required maxlength="100" pattern=".*\S.*" title="Enter an agent name." placeholder="Enter agent name">
            </div>

            <div class="form-group">
                <label>Father Name</label>
                <input type="text" name="father_name" value="{{ agent_form_values.father_name|default:'' }}" maxlength="100" pattern=".*\S.*" title="Enter a valid father name or leave this field blank." placeholder="Enter father name">
            </div>

            <div class="form-group">
                <label>Role / Designations</label>
                <input type="text" name="role" required maxlength="100" pattern=".*\S.*" title="Enter the agent's role or designation." placeholder="e.g. Property Consultant" value="{{ agent_form_values.role|default:'Property Consultant' }}">
            </div>
            <div class="form-group">
                <label>Experience</label>
                <input type="text" name="experience" value="{{ agent_form_values.experience|default:'' }}" required maxlength="50" pattern=".*\S.*" title="Enter the agent's experience." placeholder="e.g. 5+ Years">
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email" value="{{ agent_form_values.email|default:'' }}" required maxlength="254" title="Enter a valid email address." placeholder="Enter email address">
            </div>
            <div class="form-group">
                <label>Login Password</label>
                <div class="password-field">
                    <input id="agentPassword" type="password" name="password" required minlength="8" title="Password must be at least 8 characters long." placeholder="Enter login password for agent"
                           oninput="const toggle=this.parentElement.querySelector('.password-toggle'); toggle.hidden=!this.value; if(!this.value){this.type='password'; toggle.setAttribute('aria-label','Show password'); toggle.setAttribute('title','Show password'); toggle.setAttribute('aria-pressed','false'); toggle.querySelector('i').className='fa fa-eye';}">
                    <button type="button" class="password-toggle" hidden aria-label="Show password" aria-pressed="false" title="Show password"
                            onclick="const password=this.previousElementSibling; const visible=password.type==='password'; password.type=visible?'text':'password'; this.setAttribute('aria-label',visible?'Hide password':'Show password'); this.setAttribute('title',visible?'Hide password':'Show password'); this.setAttribute('aria-pressed',String(visible)); this.querySelector('i').className=visible?'fa fa-eye-slash':'fa fa-eye';">
                        <i class="fa fa-eye" aria-hidden="true"></i>
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label>Phone Number</label>
                <input type="tel" name="phone" value="{{ agent_form_values.phone|default:'' }}" required minlength="10" maxlength="13" pattern="[+0-9() -]{7,20}" title="Enter a phone number with 7 to 20 digits or phone symbols." placeholder="Enter phone number">
            </div>

            <div class="form-group">
                <label>Aadhaar Card</label>
                <input type="file" name="aadhaar_document" accept=".pdf,.jpg,.jpeg,.png">
            </div>
            <div class="form-group">
                <label>PAN Card</label>
                <input type="file" name="pan_document" accept=".pdf,.jpg,.jpeg,.png">
            </div>

            <div class="form-group">
                <label>Agent Profile Image</label>
                <input type="file" name="image" accept="image/*" required>
            </div>
            <button type="submit">Save Agent</button>
        </form>
    </div>
</body>
</html>
