<div class="edit-lead-container">
    <!-- Header with Title and Back to Dashboard Button -->
    <div class="edit-lead-header">
        <h2>📋 Edit Lead / Enquiry</h2>
        <a href="{% url 'admin_dashboard' %}" class="btn-back-dashboard">
            <i class="fa fa-arrow-left"></i> Back to Dashboard
        </a>
    </div>
    
    <form method="POST" action="{% url 'edit_lead' lead.pk %}" class="ajax-form">
        {% csrf_token %}
        
        <p class="form-group">
            <label>Name</label>
            <input type="text" name="name" value="{{ lead.name }}" required>
        </p>

        <p class="form-group">
            <label>Email</label>
            <input type="email" name="email" value="{{ lead.email }}">
        </p>

        <p class="form-group">
            <label>Phone</label>
            <input type="text" name="phone" value="{{ lead.phone }}">
        </p>

        <p class="form-group">
            <label>Message</label>
            <textarea name="message" rows="4">{{ lead.message }}</textarea>
        </p>
        
        <div class="btn-container">
            <button type="submit" class="btn-success-custom">Update Lead</button>
            <a href="{% url 'lead_list' %}" class="btn-secondary-custom nav-link-ajax">Cancel</a>
        </div>
    </form>
</div>
