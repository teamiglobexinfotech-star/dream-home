<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Admin Profile</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        .profile-form-box {
            max-width: 750px;
            margin: 30px auto;
            background: #ffffff;
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
        }

        .profile-form-box .form-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 12px;
        }

        .profile-form-box h2 {
            font-size: 20px;
            font-weight: 700;
            color: #1e293b;
            margin: 0;
        }

        .profile-form-box .btn-back {
            background-color: #f1f5f9;
            color: #475569;
            padding: 6px 14px;
            font-size: 13px;
            font-weight: 600;
            border-radius: 6px;
            text-decoration: none;
            transition: background 0.2s;
        }

        .profile-form-box .btn-back:hover {
            background-color: #e2e8f0;
            color: #1e293b;
        }

        .profile-form-box .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 18px;
        }

        .profile-form-box form label {
            font-size: 13px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 6px;
        }

        .profile-form-box form input,
        .profile-form-box form textarea {
            width: 100%;
            padding: 10px 14px;
            font-size: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            background-color: #f8fafc;
            color: #1e293b;
            outline: none;
            box-sizing: border-box;
            transition: all 0.2s ease;
        }

        .profile-form-box form input:focus,
        .profile-form-box form textarea:focus {
            border-color: #3b82f6;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        .profile-form-box form input[type="file"] {
            padding: 8px 10px;
        }

        .profile-form-box form textarea {
            min-height: 120px;
            resize: vertical;
        }

        .profile-form-box .profile-pic-container {
            text-align: center;
            margin-bottom: 24px;
        }

        .profile-form-box .profile-pic,
        .profile-form-box .profile-pic-placeholder {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #3b82f6;
            margin: 0 auto 10px;
        }

        .profile-form-box .profile-pic-placeholder {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f1f5f9;
            color: #64748b;
            font-size: 36px;
        }

        .profile-form-box .profile-image-input {
            display: inline-block;
            max-width: 100%;
        }

        .profile-form-box form button[type="submit"] {
            background-color: #22c55e;
            color: #ffffff;
            font-weight: 600;
            padding: 10px 22px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
        }

        .profile-form-box form button[type="submit"]:hover {
            background-color: #16a34a;
        }

        @media (max-width: 768px) {
            .profile-form-box {
                margin: 15px;
                padding: 24px;
            }

            .profile-form-box .form-header {
                align-items: flex-start;
                flex-direction: column;
                gap: 12px;
            }
        }
    </style>
</head>
<body>
    {% if show_dashboard_toast %}
        {% include "dashboard/_toast.html" %}
    {% endif %}
    <div class="profile-form-box">
        <div class="form-header">
            <h2>Edit Admin Profile</h2>
            <a href="{% url 'admin_profile' %}" class="btn-back nav-link-ajax">← Back to Profile</a>
        </div>
        
        <form method="POST" action="{% url 'admin_profile' %}" enctype="multipart/form-data" class="ajax-form">
            {% csrf_token %}
            
            <div class="profile-pic-container">
                {% if user.profile_image %}
                    <img src="{{ user.profile_image.url }}" alt="Profile Picture" class="profile-pic">
                {% else %}
                    <div class="profile-pic-placeholder">
                        <i class="fa fa-user"></i>
                    </div>
                {% endif %}
                <div class="profile-image-input">
                    <input type="file" name="profile_image" accept="image/*">
                </div>
            </div>

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="full_name" value="{{ user.full_name }}" required>
            </div>
            
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email" value="{{ user.email }}" required>
            </div>
            
            <div class="form-group">
                <label>Mobile Number</label>
                <input type="text" name="mobile_number" value="{{ user.mobile_number }}">
            </div>

            <div class="form-group">
                <label>Designation / Role Title</label>
                <input type="text" name="designation" value="{{ user.designation|default:'' }}">
            </div>

            <div class="form-group">
                <label>Bio / About Me</label>
                <textarea name="bio">{{ user.bio|default:'' }}</textarea>
            </div>

            <div class="form-group">
                <label>Office Address</label>
                <input type="text" name="office_address" value="{{ user.office_address|default:'' }}">
            </div>

            <button type="submit">Update Profile</button>
        </form>
    </div>
</body>
</html>
