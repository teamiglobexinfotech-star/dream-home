<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Add Property - Dashboard</title>

    <style>

        body {
            background-color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .property-form-box {
            max-width: 750px;
            margin: 30px auto;
            background: #ffffff;
            padding: 30px 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
        }

        .property-form-box .form-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 12px;
        }

        .property-form-box h2 {
            font-size: 20px;
            font-weight: 700;
            color: #1e293b;
            margin: 0;
        }

        .property-form-box .btn-back {
            background-color: #f1f5f9;
            color: #475569;
            padding: 6px 14px;
            font-size: 13px;
            font-weight: 600;
            border-radius: 6px;
            text-decoration: none;
            transition: background 0.2s;
        }

        .property-form-box .btn-back:hover {
            background-color: #e2e8f0;
            color: #1e293b;
        }

        .property-form-box form p {
            display: flex;
            flex-direction: column;
            margin-bottom: 18px;
        }

        .property-form-box form label {
            font-size: 13px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 6px;
        }

        .property-form-box form input[type="text"],
        .property-form-box form input[type="number"],
        .property-form-box form input[type="email"],
        .property-form-box form input[type="password"],
        .property-form-box form select,
        .property-form-box form textarea {
            width: 100% !important;
            padding: 10px 14px;
            font-size: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            background-color: #f8fafc;
            color: #1e293b;
            outline: none;
            box-sizing: border-box;
            transition: all 0.2s ease;
        }

        .property-form-box form input:focus,
        .property-form-box form select:focus,
        .property-form-box form textarea:focus {
            border-color: #3b82f6;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        .property-form-box form textarea {
            min-height: 120px;
            resize: vertical;
        }

        .property-form-box form input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #3b82f6;
            margin-right: 8px;
            display: inline-block;
            vertical-align: middle;
        }

        .property-form-box form p:has(input[type="checkbox"]) {
            flex-direction: row;
            align-items: center;
        }

        .property-form-box form p:has(input[type="checkbox"]) label {
            margin-bottom: 0;
        }

        .property-form-box form button,
        .property-form-box form input[type="submit"] {
            background-color: #22c55e !important;
            color: #ffffff !important;
            font-weight: 600;
            padding: 10px 22px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.2s;
            margin-right: 10px;
            display: inline-block;
        }

        .property-form-box form button:hover,
        .property-form-box form input[type="submit"]:hover {
            background-color: #16a34a !important;
        }

        /*
         * IMAGE PREVIEW AREA
         */

        #selected-images-preview {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
        }

        .image-preview-item {
            position: relative;
            width: 120px;
            height: 90px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            overflow: hidden;
            background: #f8fafc;
        }

        .image-preview-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .remove-image-btn {
            position: absolute;
            top: 5px;
            right: 5px;
            width: 24px;
            height: 24px;
            border: none !important;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.65) !important;
            color: #ffffff !important;
            font-size: 18px !important;
            line-height: 20px;
            padding: 0 !important;
            margin: 0 !important;
            cursor: pointer;
            display: flex !important;
            align-items: center;
            justify-content: center;
        }

        .remove-image-btn:hover {
            background: rgba(220, 38, 38, 0.9) !important;
        }

        #image-count {
            display: block;
            margin-top: 8px;
            color: #334155;
            font-size: 13px;
            font-weight: 700;
        }

        /* =========================================
   IMAGE CROP POPUP
   ========================================= */

.image-crop-modal {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 99999;
    background: rgba(0, 0, 0, 0.78);
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.image-crop-box {
    width: min(950px, 95vw);
    max-height: 92vh;
    background: #fff;
    border-radius: 14px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
}

.image-crop-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    border-bottom: 1px solid #e5e7eb;
}

.image-crop-header h3 {
    margin: 0;
    font-size: 18px;
    color: #111827;
}

.image-crop-close {
    border: none !important;
    background: transparent !important;
    color: #64748b !important;
    font-size: 28px !important;
    cursor: pointer;
    line-height: 1;
    padding: 0 !important;
    margin: 0 !important;
}

.image-crop-area {
    padding: 20px;
    background: #111827;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: auto;
}

.crop-canvas-wrapper {
    position: relative;
    display: inline-block;
    max-width: 100%;
    max-height: 65vh;
    overflow: hidden;
    user-select: none;
}

#cropImage {
    display: block;
    max-width: 100%;
    max-height: 65vh;
    width: auto;
    height: auto;
    user-select: none;
    pointer-events: none;
}

.crop-selection {
    position: absolute;
    left: 10%;
    top: 10%;
    width: 80%;
    height: 80%;
    box-sizing: border-box;
    border: 2px solid #ffffff;
    box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.55);
    cursor: move;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    z-index: 10;
}

.crop-selection::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
        linear-gradient(
            to right,
            transparent 33.33%,
            rgba(255,255,255,0.5) 33.33%,
            rgba(255,255,255,0.5) 33.8%,
            transparent 33.8%,
            transparent 66.66%,
            rgba(255,255,255,0.5) 66.66%,
            rgba(255,255,255,0.5) 67.1%,
            transparent 67.1%
        ),
        linear-gradient(
            to bottom,
            transparent 33.33%,
            rgba(255,255,255,0.5) 33.33%,
            rgba(255,255,255,0.5) 33.8%,
            transparent 33.8%,
            transparent 66.66%,
            rgba(255,255,255,0.5) 66.66%,
            rgba(255,255,255,0.5) 67.1%,
            transparent 67.1%
        );
    pointer-events: none;
}

.crop-handle {
    position: absolute;
    width: 14px;
    height: 14px;
    box-sizing: border-box;
    background: #ffffff;
    border: 2px solid #2563eb;
    border-radius: 3px;
    z-index: 20;
    pointer-events: auto;
}

.crop-handle-nw {
    top: -7px;
    left: -7px;
    cursor: nwse-resize;
}

.crop-handle-ne {
    top: -7px;
    right: -7px;
    cursor: nesw-resize;
}

.crop-handle-sw {
    bottom: -7px;
    left: -7px;
    cursor: nesw-resize;
}

.crop-handle-se {
    bottom: -7px;
    right: -7px;
    cursor: nwse-resize;
}

.image-crop-footer {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    padding: 15px 20px;
    border-top: 1px solid #e5e7eb;
    background: #fff;
}

.crop-cancel-btn,
.crop-confirm-btn {
    border: none !important;
    padding: 10px 18px !important;
    border-radius: 8px !important;
    font-size: 14px !important;
    font-weight: 600 !important;
    cursor: pointer;
    margin: 0 !important;
}

.crop-cancel-btn {
    background: #e5e7eb !important;
    color: #374151 !important;
}

.crop-confirm-btn {
    background: #2563eb !important;
    color: #fff !important;
}

.crop-confirm-btn:hover {
    background: #1d4ed8 !important;
}

@media (max-width: 768px) {

    .image-crop-modal {
        padding: 10px;
    }

    .image-crop-box {
        width: 100%;
        max-height: 95vh;
    }

    .image-crop-area {
        padding: 10px;
    }

    #cropImage {
        max-height: 60vh;
    }

    .image-crop-footer {
        padding: 12px;
    }
}

    </style>

</head>

<body>

    <div class="property-form-box">

        <div class="form-header">

            <h2>Add New Property</h2>

            <a
                href="{% url 'admin_dashboard' %}"
                class="btn-back"
            >
                ← Back to Dashboard
            </a>

        </div>


        <form
            id="add-property-form"
            method="POST"
            action="{% url 'add_property' %}"
            enctype="multipart/form-data"
        >

            {% csrf_token %}


            {% for field in form %}

                {% if field.name != 'images' %}

                    <p>

                        {{ field.label_tag }}

                        {{ field }}

                        {% if field.errors %}

                            {{ field.errors }}

                        {% endif %}

                    </p>

                {% endif %}

            {% endfor %}


            <!-- PROPERTY IMAGES -->

            <p>

                <label for="property-images-input">
                    Property Images
                </label>


                <input
                    type="file"
                    id="property-images-input"
                    name="images"
                    accept="image/*"
                >


                <small
                    style="
                        color:#64748b;
                        display:block;
                        margin-top:5px;
                    "
                >
                    Add 1 to 5 images, one by one.
                </small>


                <!-- IMAGE COUNTER -->

                <strong id="image-count">
                    0/5
                </strong>

            </p>


            <!-- IMAGE PREVIEWS -->

            <div id="selected-images-preview"></div>


            <!-- BUTTONS -->

            <div style="margin-top: 24px;">

                <button
                    type="submit"
                    class="btn btn-success"
                >
                    Save Property
                </button>


                <a
                    href="{% url 'admin_dashboard' %}"
                    class="btn btn-secondary"
                    style="
                        background-color: #64748b;
                        color: white;
                        padding: 10px 22px;
                        text-decoration: none;
                        border-radius: 8px;
                        display: inline-block;
                        font-weight: 600;
                        font-size: 14px;
                    "
                >
                    Cancel
                </a>

            </div>

        </form>

    </div>

    <!-- IMAGE CROP POPUP -->
<div id="imageCropModal" class="image-crop-modal">

    <div class="image-crop-box">

        <div class="image-crop-header">

            <h3>Adjust Property Image</h3>

            <button
                type="button"
                id="cropCloseBtn"
                class="image-crop-close"
            >
                &times;
            </button>

        </div>


        <div class="image-crop-area">

            <div
                id="cropCanvasWrapper"
                class="crop-canvas-wrapper"
            >

                <img
                    id="cropImage"
                    src=""
                    alt="Crop Image"
                >

                <div
                    id="cropSelection"
                    class="crop-selection"
                >

                    <span class="crop-handle crop-handle-nw"></span>
                    <span class="crop-handle crop-handle-ne"></span>
                    <span class="crop-handle crop-handle-sw"></span>
                    <span class="crop-handle crop-handle-se"></span>

                </div>

            </div>

        </div>


        <div class="image-crop-footer">

            <button
                type="button"
                id="cropCancelBtn"
                class="crop-cancel-btn"
            >
                Cancel
            </button>


            <button
                type="button"
                id="cropConfirmBtn"
                class="crop-confirm-btn"
            >
                <i class="fa-solid fa-crop-simple"></i>
                Crop & Add
            </button>

        </div>

    </div>

</div>


    

</body>

</html>
