
<div class="property-form-box" id="dashboard-content-area">

    <div class="form-header">
        <h2>Edit Property</h2>

        <a href="{% url 'agent_properties' %}" class="btn-back">
            ← Back to My Properties
        </a>
    </div>

    <form method="POST"
          id="edit-property-form"
          enctype="multipart/form-data"
          action="{% url 'agent_edit_property' property.pk %}">

        {% csrf_token %}

        {{ form.as_p }}

        {% if property.image %}
            <div style="margin-top: -5px; margin-bottom: 20px;">
                <label style="
                    display: block;
                    font-size: 13px;
                    font-weight: 600;
                    color: #334155;
                    margin-bottom: 8px;
                ">
                    Current Property Image
                </label>

                <div style="
                    width: 180px;
                    height: 120px;
                    border-radius: 8px;
                    overflow: hidden;
                    border: 1px solid #e2e8f0;
                    background: #f8fafc;
                ">
                    <img src="{{ property.image.url }}"
                         alt="{{ property.title }}"
                         style="
                            width: 100%;
                            height: 100%;
                            object-fit: cover;
                         ">
                </div>

                <small style="
                    display: block;
                    margin-top: 6px;
                    color: #64748b;
                    font-size: 12px;
                ">
                    New image select karne par current image replace ho jayegi.
                </small>
            </div>
        {% endif %}

        <div style="margin-top: 24px;">

            <button type="submit"
                    class="btn btn-success"
                    id="update-btn">
                Update Property
            </button>

            <a href="{% url 'agent_properties' %}"
               style="
                    background-color: #64748b;
                    color: white;
                    padding: 10px 22px;
                    text-decoration: none;
                    border-radius: 8px;
                    display: inline-block;
                    font-weight: 600;
                    font-size: 14px;
               ">
                Cancel
            </a>

        </div>

    </form>

</div>


<!-- AJAX JavaScript -->

<script>
(function () {

    $(document).off('submit.editProperty', '#edit-property-form');

    $(document).on('submit.editProperty', '#edit-property-form', function (e) {

        e.preventDefault();
        e.stopImmediatePropagation();

        const form = this;
        const $form = $(form);
        const $updateBtn = $('#update-btn');
        const $container = $('#dashboard-dynamic-content');

        if ($updateBtn.prop('disabled')) {
            return false;
        }

        const formData = new FormData(form);

        $updateBtn
            .prop('disabled', true)
            .text('Updating...');

        $.ajax({

            url: $form.attr('action'),

            type: 'POST',

            data: formData,

            processData: false,

            contentType: false,

            headers: {
                'X-Requested-With': 'XMLHttpRequest'
            },

            success: function (response) {

                if (response.status === 'success') {

                    const toast = $(`
                        <div style="
                            position: fixed;
                            top: 25px;
                            right: 25px;
                            z-index: 99999;
                            background: #ffffff;
                            color: #1e293b;
                            padding: 14px 20px;
                            border-radius: 10px;
                            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
                            border-left: 4px solid #22c55e;
                            font-size: 14px;
                            font-weight: 600;
                        ">
                            ✓ Property updated successfully!
                        </div>
                    `);

                    $('body').append(toast);

                    setTimeout(function () {

                        toast.fadeOut(300, function () {
                            $(this).remove();
                        });

                    }, 1800);


                    /*
                     * Update ke baad My Properties page
                     * AJAX se reload hoga
                     */

                    setTimeout(function () {

                        $.ajax({

                            url: "{% url 'agent_properties' %}",

                            type: "GET",

                            headers: {
                                'X-Requested-With': 'XMLHttpRequest'
                            },

                            success: function (html) {

                                const parser = new DOMParser();

                                const doc = parser.parseFromString(
                                    html,
                                    'text/html'
                                );

                                const content =
                                    doc.getElementById(
                                        'dashboard-dynamic-content'
                                    );

                                if (content) {

                                    $container.html(
                                        content.innerHTML
                                    );

                                } else {

                                    $container.html(html);

                                }

                            },

                            error: function (xhr) {

                                console.error(
                                    'My Properties load error:',
                                    xhr.responseText
                                );

                                window.location.href =
                                    "{% url 'agent_properties' %}";
                            }

                        });

                    }, 1800);

                }

                else {

                    $updateBtn
                        .prop('disabled', false)
                        .text('Update Property');

                    $('#dashboard-content-area')
                        .html(response);

                }

            },

            error: function (xhr) {

                console.error(
                    'Property update error:',
                    xhr.responseText
                );

                $updateBtn
                    .prop('disabled', false)
                    .text('Update Property');

                alert(
                    'Something went wrong. Please try again.'
                );

            }

        });

        return false;

    });

})();
</script>


<!-- Isolated CSS -->

<style>

    .property-form-box {

        max-width: 750px;

        margin: 20px auto;

        background: #ffffff;

        padding: 30px 40px;

        border-radius: 12px;

        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);

    }


    .property-form-box .form-header {

        display: flex;

        justify-content: space-between;

        align-items: center;

        margin-bottom: 24px;

        border-bottom: 2px solid #f1f5f9;

        padding-bottom: 12px;

    }


    .property-form-box h2 {

        font-size: 20px;

        font-weight: 700;

        color: #1e293b;

        margin: 0;

    }


    .property-form-box .btn-back {

        background-color: #f1f5f9;

        color: #475569;

        padding: 6px 14px;

        font-size: 13px;

        font-weight: 600;

        border-radius: 6px;

        text-decoration: none;

        transition: background 0.2s;

    }


    .property-form-box .btn-back:hover {

        background-color: #e2e8f0;

        color: #1e293b;

    }


    .property-form-box form p {

        display: flex;

        flex-direction: column;

        margin-bottom: 18px;

    }


    .property-form-box form label {

        font-size: 13px;

        font-weight: 600;

        color: #334155;

        margin-bottom: 6px;

    }


    .property-form-box form input[type="text"],

    .property-form-box form input[type="number"],

    .property-form-box form input[type="email"],

    .property-form-box form input[type="password"],

    .property-form-box form input[type="url"],

    .property-form-box form input[type="file"],

    .property-form-box form select,

    .property-form-box form textarea {

        width: 100% !important;

        padding: 10px 14px;

        font-size: 14px;

        border: 1px solid #cbd5e1;

        border-radius: 8px;

        background-color: #f8fafc;

        color: #1e293b;

        outline: none;

        box-sizing: border-box;

        transition: all 0.2s ease;

    }


    .property-form-box form input:focus,

    .property-form-box form select:focus,

    .property-form-box form textarea:focus {

        border-color: #3b82f6;

        background-color: #ffffff;

        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);

    }


    .property-form-box form textarea {

        min-height: 120px;

        resize: vertical;

    }


    .property-form-box form input[type="checkbox"] {

        width: 18px;

        height: 18px;

        accent-color: #3b82f6;

        margin-right: 8px;

        display: inline-block;

        vertical-align: middle;

    }


    .property-form-box form p:has(input[type="checkbox"]) {

        flex-direction: row;

        align-items: center;

    }


    .property-form-box form p:has(input[type="checkbox"]) label {

        margin-bottom: 0;

    }


    .property-form-box form button,

    .property-form-box form input[type="submit"] {

        background-color: #22c55e !important;

        color: #ffffff !important;

        font-weight: 600;

        padding: 10px 22px;

        border: none;

        border-radius: 8px;

        cursor: pointer;

        font-size: 14px;

        transition: background 0.2s;

        margin-right: 10px;

        display: inline-block;

    }


    .property-form-box form button:hover,

    .property-form-box form input[type="submit"]:hover {

        background-color: #16a34a !important;

    }

</style>
