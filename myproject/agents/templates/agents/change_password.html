<div id="dashboard-dynamic-content" class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100 max-w-xl mx-auto">
    <div class="mb-6">
        <h2 class="text-lg font-bold text-slate-900">Change Password</h2>
        <p class="text-xs text-slate-500 mt-0.5">Ensure your account is using a secure password to stay safe.</p>
    </div>
    
    <form id="changePasswordForm" method="POST" action="{% url 'agent_change_password' %}" class="space-y-4">
        {% csrf_token %}
        
        {% if form.non_field_errors %}
            <div class="p-3 bg-rose-50 border border-rose-200 text-rose-700 rounded-xl text-xs">
                {{ form.non_field_errors }}
            </div>
        {% endif %}
        
        {% for field in form %}
            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">{{ field.label }}</label>
                <!-- Django fields par Tailwind classes inject karne ke liye ya custom render karne ke liye -->
                <div class="[&>input]:w-full [&>input]:px-3 [&>input]:py-2 [&>input]:text-xs [&>input]:bg-slate-50 [&>input]:border [&>input]:border-slate-200 [&>input]:rounded-xl [&>input]:focus:outline-none [&>input]:focus:border-blue-600">
                    {{ field }}
                </div>
                {% if field.errors %}
                    <p class="text-rose-600 text-xs mt-1">{{ field.errors.0 }}</p>
                {% endif %}
            </div>
        {% endfor %}
        
        <div class="pt-2">
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 px-4 rounded-xl transition text-xs shadow-sm shadow-blue-500/20">
                Update Password
            </button>
        </div>
    </form>
</div>
