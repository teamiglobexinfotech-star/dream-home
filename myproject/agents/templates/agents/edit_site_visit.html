<div class="p-6 bg-slate-900 text-white rounded-xl shadow-md border border-slate-700">
    <h2 class="text-2xl font-bold mb-6 text-indigo-400">Edit Site Visit</h2>

    <form id="editSiteVisitForm" method="POST" action="{% url 'agent_edit_site_visit' visit.id %}" enctype="multipart/form-data" class="space-y-4">
        {% csrf_token %}
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium mb-1">Select Scheduled Visit</label>
                <select name="schedule_id" required class="w-full p-2 rounded bg-slate-700 border border-slate-600 focus:outline-none">
                    {% for schedule in schedule %}
                        <option value="{{ schedule.id }}" {% if schedule.id == visit.schedule.id %}selected{% endif %}>
                            {{ schedule.name }} ({{ schedule.phone }})
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium mb-1">Location Visited / Address</label>
                <input type="text" name="location_visited" value="{{ visit.location_visited }}" required class="w-full p-2 rounded bg-slate-700 border border-slate-600 focus:outline-none">
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium mb-1">Visit Photo (Leave blank to keep current)</label>
                <input type="file" name="visit_image" accept="image/*" class="w-full p-2 rounded bg-slate-700 border border-slate-600">
            </div>

            <div>
                <label class="block text-sm font-medium mb-1">Notes / Remarks</label>
                <input type="text" name="notes" value="{{ visit.notes|default:'' }}" class="w-full p-2 rounded bg-slate-700 border border-slate-600 focus:outline-none">
            </div>
        </div>

        <div class="flex gap-3 pt-2">
            <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-4 py-2 rounded-lg transition">
                Update Visit
            </button>
            <button type="button" id="cancelEditBtn" class="bg-slate-700 hover:bg-slate-600 text-white font-semibold px-4 py-2 rounded-lg transition">
                Cancel
            </button>
        </div>
    </form>
</div>
