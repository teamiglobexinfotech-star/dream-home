<div class="p-6 bg-white text-slate-900 rounded-xl shadow-md">
    <div class="mb-5">
        <h2 class="text-2xl font-bold text-indigo-600">Update Site Visit</h2>
        {% if visit.admin_feedback %}
            <p class="mt-3 rounded-lg border border-amber-200 bg-amber-50 p-3 text-sm text-amber-800">
                Admin feedback: {{ visit.admin_feedback }}
            </p>
        {% endif %}
    </div>

    <form id="editSiteVisitForm" method="POST" action="{% url 'agent_edit_site_visit' visit.id %}" enctype="multipart/form-data" class="space-y-4">
        {% csrf_token %}

        <div>
            <label class="block text-sm font-medium mb-1">Scheduled Visit</label>
            <select disabled class="w-full p-2 rounded bg-slate-100 border border-slate-300">
                {% for schedule in schedules %}
                    <option value="{{ schedule.id }}" selected>
                        {{ schedule.name }} — {{ schedule.property.title|default:"Property not specified" }} ({{ schedule.visit_date|date:"d M Y, h:i A" }})
                    </option>
                {% empty %}
                    <option selected>Visit schedule unavailable</option>
                {% endfor %}
            </select>
        </div>

        {% if visit.status == 'Scheduled' %}
            <div>
                <label class="block text-sm font-medium mb-1">Requested Visit Date &amp; Time</label>
                <input type="datetime-local" name="visit_date" value="{{ visit_date_value }}" min="{{ min_visit_date }}" required class="w-full p-2 rounded border border-slate-300">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Visit Type</label>
                <select name="visit_type" required class="w-full p-2 rounded border border-slate-300">
                    <option value="">Select a visit type</option>
                    {% for value, label in visit_types %}
                        <option value="{{ value }}" {% if visit.visit_type == value %}selected{% endif %}>{{ label }}</option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Visit Purpose</label>
                <textarea name="visit_purpose" rows="3" required class="w-full p-2 rounded border border-slate-300">{{ visit.visit_purpose }}</textarea>
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Additional Remarks</label>
                <textarea name="message" rows="2" class="w-full p-2 rounded border border-slate-300">{{ visit.schedule.message }}</textarea>
            </div>
        {% else %}
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium mb-1">Location Visited</label>
                    <input type="text" name="location_visited" value="{{ visit.location_visited }}" required class="w-full p-2 rounded border border-slate-300">
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Outcome</label>
                    <input type="text" name="outcome" value="{{ visit.outcome }}" required class="w-full p-2 rounded border border-slate-300">
                </div>
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Customer Feedback</label>
                <textarea name="feedback" rows="3" class="w-full p-2 rounded border border-slate-300">{{ visit.feedback }}</textarea>
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">Visit Photo (Optional)</label>
                <input type="file" name="visit_image" accept="image/*" class="w-full p-2 rounded border border-slate-300">
            </div>
        {% endif %}

        <div>
            <label class="block text-sm font-medium mb-1">Notes / Remarks</label>
            <textarea name="notes" rows="3" class="w-full p-2 rounded border border-slate-300">{{ visit.notes|default:'' }}</textarea>
        </div>

        <div class="flex gap-3 pt-2">
            <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-4 py-2 rounded-lg">
                Resubmit for Admin Approval
            </button>
            <button type="button" id="cancelEditBtn" class="bg-slate-200 hover:bg-slate-300 px-4 py-2 rounded-lg">
                Cancel
            </button>
        </div>
    </form>
</div>
